<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidan finns inte – häst</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
:root{--paper:#f2f1e9;--ink:#101310;--orange:#ff6507;--lime:#b1ff25}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
main{flex:1;padding:6vw 5vw;display:flex;flex-direction:column;justify-content:center;gap:2rem}
.code{font-weight:900;font-size:clamp(7rem,30vw,22rem);line-height:.8;letter-spacing:-.06em;margin:0}
.code span{color:var(--orange)}
h1{font-size:clamp(1.6rem,5vw,3.2rem);margin:0;max-width:18ch;line-height:1.05}
p{font-family:'Courier New',monospace;font-size:1.05rem;margin:0;max-width:40ch}
nav{display:flex;flex-wrap:wrap;gap:.75rem}
nav a{color:var(--ink);text-decoration:none;font-weight:700;border:3px solid var(--ink);padding:.7rem 1.1rem;background:#fff;box-shadow:5px 5px 0 var(--ink)}
nav a:first-child{background:var(--lime)}
nav a:hover{background:var(--orange)}
nav a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
footer{height:4vw;min-height:24px;background:var(--orange)}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">4<span>0</span>4</p>
<h1>Hästen sprang iväg med den här sidan.</h1>
<p>Adressen finns inte på haest.se. Prova någon av de här istället.</p>
<nav aria-label="Vidare">
<a href="/">Till startsidan</a>
<a href="/#work">Spelningar</a>
<a href="/turbogalopp/">Spela Turbogalopp</a>
</nav>
</main>
<footer></footer>
<script>window.goatcounter = { path: function (p) { return '404: ' + p; } };</script>
<script data-goatcounter="https://haest.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
