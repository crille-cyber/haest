name: Synka Instagram-bilder

on:
  schedule:
    - cron: '0 6 * * *'   # varje dag kl. 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Samma grupp i båda jobben som skriver till main, så de aldrig krockar.
concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Förnyar Instagram-token (gäller 60 dagar) och sparar den nya som hemligheten IG_TOKEN.
      # Spara kräver hemligheten GH_PAT (fine-grained token med Secrets: Read and write för det här repot).
      # Om förnyelsen misslyckas används nuvarande token vidare.
      - name: Förnya token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          res=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          new=$(echo "$res" | jq -r '.access_token // empty')
          exp=$(echo "$res" | jq -r '.expires_in // empty')
          token="$IG_TOKEN"
          if [ -z "$new" ]; then
            echo "::warning title=Instagram-token::Kunde inte förnya token, använder nuvarande: $(echo "$res" | jq -r '.error.message // "okänt fel"')"
          else
            echo "::add-mask::$new"
            token="$new"
            if [ -n "$GH_PAT" ]; then
              if printf %s "$new" | GH_TOKEN="$GH_PAT" gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY"; then
                echo "Ny token sparad som IG_TOKEN. Gäller i $exp sekunder."
              else
                echo "::warning title=GH_PAT::Kunde inte spara ny Instagram-token. GH_PAT har troligen gått ut eller saknar Secrets: Read and write. Galleriet slutar synka när IG_TOKEN går ut."
              fi
            else
              echo "::warning title=GH_PAT::Token förnyad, men GH_PAT saknas så den sparas inte. Galleriet slutar synka när IG_TOKEN går ut."
            fi
          fi
          echo "IG_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Installera ImageMagick
        run: command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick)

      - name: Hämta nya bilder
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/sync-instagram.mjs

      - name: Spara ändringar
        run: |
          git config user.name "haest-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/gallery data/gallery.json
          if git diff --cached --quiet; then
            echo "Inga nya bilder."
          else
            git commit -m "Synka Instagram-bilder"
            git pull --rebase origin main
            git push
          fi
