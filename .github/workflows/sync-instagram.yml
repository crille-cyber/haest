name: Synka Instagram-bilder

on:
  schedule:
    - cron: '0 6 * * *'   # varje dag kl. 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Förnya token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          res=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          new=$(echo "$res" | jq -r '.access_token // empty')
          exp=$(echo "$res" | jq -r '.expires_in // empty')
          if [ -z "$new" ]; then
            echo "Kunde inte förnya token: $(echo "$res" | jq -r '.error.message // "okänt fel"')"
          elif [ "$new" = "$IG_TOKEN" ]; then
            echo "Token förnyad. Samma token. Gäller i $exp sekunder."
          else
            echo "Token förnyad. NY token (uppdatera IG_TOKEN). Gäller i $exp sekunder."
          fi

      - name: Hämta nya bilder
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/sync-instagram.mjs

      - name: Spara ändringar
        run: |
          git config user.name "haest-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/gallery data/gallery.json
          if git diff --cached --quiet; then
            echo "Inga nya bilder."
          else
            git commit -m "Synka Instagram-bilder"
            git push
          fi
