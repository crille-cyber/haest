name: Bygg spelningar och SEO-data

# Skriver in spelningarna från data/gigs.json direkt i index.html (lista + JSON-LD)
# och uppdaterar sitemap.xml. Körs när spelningarna ändras och en gång per dygn,
# så att passerade spelningar flyttas till "spelade".
on:
  push:
    branches: [main]
    paths:
      - 'data/gigs.json'
      - 'scripts/build-seo.mjs'
      - 'index.html'
      - 'styles.css'
      - 'script.js'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Samma grupp i båda jobben som skriver till main, så de aldrig krockar.
concurrency:
  group: main-writer
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Bygg
        run: node scripts/build-seo.mjs

      - name: Spara ändringar
        run: |
          # Bara datumet i sitemap ändrat? Då behövs ingen commit.
          if git diff --quiet -- index.html llms.txt; then
            echo "Inga ändringar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml llms.txt
          git commit -m "Uppdatera spelningar och SEO-data"
          git pull --rebase origin main
          git push
